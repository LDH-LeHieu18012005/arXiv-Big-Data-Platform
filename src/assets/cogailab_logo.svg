<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" role="img" aria-label="CogAI Lab">
  <defs>
    <linearGradient id="cogBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d8ef7"/>
      <stop offset="1" stop-color="#1a4fa0"/>
    </linearGradient>
    <radialGradient id="cogCore" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#8fc4ff"/>
      <stop offset="1" stop-color="#1a6cf0"/>
    </radialGradient>
  </defs>

  <!-- Cog / network mark -->
  <circle cx="62" cy="80" r="39" fill="none" stroke="url(#cogBlue)" stroke-width="13"
          stroke-dasharray="7.5 12.5" stroke-linecap="round"/>
  <circle cx="62" cy="80" r="25" fill="none" stroke="#9cc3ee" stroke-width="5"/>
  <circle cx="62" cy="80" r="11" fill="url(#cogCore)"/>

  <!-- Wordmark: one text run so kerning is natural -->
  <text x="126" y="105" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif"
        font-size="68" font-weight="700" letter-spacing="-2.2">
    <tspan fill="#8aa6bf">Cog</tspan><tspan fill="#123a5c">AI</tspan><tspan fill="#123a5c"> </tspan><tspan fill="#1a6cf0">Lab</tspan>
  </text>
</svg>
